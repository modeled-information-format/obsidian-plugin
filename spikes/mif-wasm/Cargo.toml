# mif-rs compiled to WASM: the plugin's parity oracle (tests/wasm-parity.test.ts).
# mif-rs crates come from its public repository at a pinned commit; bump the
# rev deliberately, with the oracle. See docs/adr/0001-engine-implementation.md.
[package]
name = "mif-wasm"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mif-frontmatter = { git = "https://github.com/modeled-information-format/mif-rs", rev = "4d7296d4744fb8b684847f26d97311bebc8bd075" }
mif-schema = { git = "https://github.com/modeled-information-format/mif-rs", rev = "4d7296d4744fb8b684847f26d97311bebc8bd075", optional = true }
mif-ontology = { git = "https://github.com/modeled-information-format/mif-rs", rev = "4d7296d4744fb8b684847f26d97311bebc8bd075", optional = true }
serde_json = { version = "1", features = ["preserve_order"] }
wasm-bindgen = "0.2"

[features]
default = ["schema", "ontology"]
schema = ["dep:mif-schema"]
ontology = ["dep:mif-ontology"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-sign-ext", "--enable-mutable-globals", "--enable-reference-types", "--enable-multivalue", "--enable-simd"]

# Standalone: not a member of any parent workspace.
[workspace]
