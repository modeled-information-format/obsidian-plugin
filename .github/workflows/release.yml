---
name: Release

# Attested delivery for the MIF Obsidian plugin (instantiated from
# mif-repo-template; structure follows mif-rs's release.yml):
#
#   build main.js / manifest.json / styles.css → SLSA provenance on each
#   → CycloneDX SBOM bound to them → SAST + SCA + IaC/license verdicts and
#   the OpenVEX disposition signed over a published source snapshot
#   → fail-closed verify of every attestation → tag-gated GitHub Release.
#
# Obsidian installs a plugin from the release whose tag equals the version in
# manifest.json, with main.js, manifest.json, and styles.css attached as
# separate assets — so tags are bare versions ("1.2.3", no "v"), the meta job
# refuses a tag that disagrees with manifest.json / versions.json, and each
# of the three files carries its own provenance and SBOM attestation.
#
# Dry-run: workflow_dispatch builds, tests, and runs the gate scans; signing,
# attestation, verify, and release are tag-gated, so a dry run mints nothing.

"on":
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  meta:
    name: Resolve Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        # v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Resolve version and check it against manifest.json
        id: meta
        run: |
          set -euo pipefail
          MANIFEST=$(jq -r .version manifest.json)
          MIN_APP=$(jq -r .minAppVersion manifest.json)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            if [ "$VERSION" != "$MANIFEST" ]; then
              echo "::error::tag ${VERSION} does not match manifest.json version ${MANIFEST}"
              exit 1
            fi
            if [ "$(jq -r --arg v "$VERSION" '.[$v] // empty' versions.json)" != "$MIN_APP" ]; then
              echo "::error::versions.json must map ${VERSION} to minAppVersion ${MIN_APP}"
              exit 1
            fi
            if [ "$(jq -r .version package.json)" != "$VERSION" ]; then
              echo "::error::package.json version does not match the tag ${VERSION}"
              exit 1
            fi
          else
            VERSION="${MANIFEST}-dev"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  # Tags are not guaranteed to point at CI-green commits; nothing untested ships.
  test:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Set up Node
        # v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/lint/package-lock.json
      - name: Lint, typecheck, test
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run lint:install
          npm run lint
          npm run typecheck
          npm test

  build:
    name: Build plugin
    needs: [meta, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # OIDC → Sigstore signing
      attestations: write
    steps:
      - name: Checkout repository
        # v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Set up Node
        # v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
          cache: npm
      - name: Build main.js and stage the release files
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          npm run check:mobile
          mkdir -p dist
          cp main.js manifest.json styles.css dist/
          sha256sum dist/*
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        # v4.1.0
        uses: >-
          actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: dist/*
      - name: Upload plugin files
        # v7.0.1
        uses: >-
          actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: obsidian-plugin-${{ needs.meta.outputs.version }}-files
          path: dist/*
          if-no-files-found: error

  # A reproducible, PUBLISHED source tarball: the subject the gate verdicts and
  # the VEX disposition are signed over (one subject per verdict).
  source:
    name: Source Snapshot
    needs: [meta]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      subject-name: ${{ steps.pack.outputs.name }}
      subject-digest: ${{ steps.pack.outputs.digest }}
    steps:
      - name: Checkout repository
        # v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Pack source snapshot
        id: pack
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          NAME="obsidian-plugin-${VERSION}-source.tar.gz"
          git archive --format=tar.gz --prefix="obsidian-plugin-${VERSION}/" \
            -o "dist/${NAME}" "${GITHUB_SHA}"
          DIGEST=$(sha256sum "dist/${NAME}" | cut -d' ' -f1)
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "digest=sha256:${DIGEST}" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        # v4.1.0
        uses: >-
          actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: dist/${{ steps.pack.outputs.name }}
      - name: Upload source artifact
        # v7.0.1
        uses: >-
          actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: obsidian-plugin-${{ needs.meta.outputs.version }}-source
          path: dist/${{ steps.pack.outputs.name }}
          if-no-files-found: error

  sbom:
    name: SBOM (generate + attest)
    needs: [meta, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        # v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Download plugin files
        # v8.0.1
        uses: >-
          actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: obsidian-plugin-${{ needs.meta.outputs.version }}-files
          path: dist
      - name: Generate CycloneDX SBOM
        # v0.24.0
        uses: >-
          anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: cyclonedx-json
          output-file: obsidian-plugin-${{ needs.meta.outputs.version }}-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest SBOM (binds each plugin file to the SBOM)
        if: startsWith(github.ref, 'refs/tags/')
        # v4.1.0
        uses: >-
          actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e
        with:
          subject-path: dist/*
          sbom-path: obsidian-plugin-${{ needs.meta.outputs.version }}-sbom.cdx.json
      - name: Upload SBOM artifact
        # v7.0.1
        uses: >-
          actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: obsidian-plugin-${{ needs.meta.outputs.version }}-sbom
          path: obsidian-plugin-${{ needs.meta.outputs.version }}-sbom.cdx.json
          if-no-files-found: error

  # Quality-gate verdicts over the shipped source.
  gate-sast:
    name: Gate — SAST (CodeQL)
    needs: [meta]
    permissions:
      security-events: write
      contents: read
      actions: read
      packages: read
    # modeled-information-format/.github main @ 70389a7
    uses: >-
      modeled-information-format/.github/.github/workflows/reusable-sast-codeql.yml@70389a7199d4d587b3d350e831334889bbcbd9de
    with:
      languages: actions,javascript-typescript
      build-mode: none

  gate-sca:
    name: Gate — SCA (OSV)
    needs: [meta]
    permissions:
      actions: read
      contents: read
      security-events: write
      pull-requests: write
    # modeled-information-format/.github main @ 70389a7
    uses: >-
      modeled-information-format/.github/.github/workflows/reusable-sca-osv.yml@70389a7199d4d587b3d350e831334889bbcbd9de
    with:
      fail-on-severity: high
      scan-args: |-
        --lockfile=package-lock.json

  gate-trivy:
    name: Gate — Trivy (IaC/license)
    needs: [meta]
    permissions:
      contents: read
      security-events: write
      actions: read
      packages: read
    # modeled-information-format/.github main @ 70389a7
    uses: >-
      modeled-information-format/.github/.github/workflows/reusable-trivy.yml@70389a7199d4d587b3d350e831334889bbcbd9de
    with:
      scan-iac: true

  attest-sast:
    name: Attest — SAST
    if: startsWith(github.ref, 'refs/tags/')
    needs: [meta, source, gate-sast]
    permissions:
      id-token: write
      attestations: write
      contents: read
    # modeled-information-format/.github main @ 70389a7
    uses: >-
      modeled-information-format/.github/.github/workflows/reusable-attest-scan.yml@70389a7199d4d587b3d350e831334889bbcbd9de
    with:
      subject-name: ${{ needs.source.outputs.subject-name }}
      subject-digest: ${{ needs.source.outputs.subject-digest }}
      predicate-type: https://modeled-information-format.github.io/attestations/sast/v1
      predicate-artifact: ${{ needs.gate-sast.outputs.sarif-artifact }}
      predicate-filename: ${{ needs.gate-sast.outputs.sarif-filename }}

  attest-sca:
    name: Attest — SCA
    if: startsWith(github.ref, 'refs/tags/')
    needs: [meta, source, gate-sca]
    permissions:
      id-token: write
      attestations: write
      contents: read
    # modeled-information-format/.github main @ 70389a7
    uses: >-
      modeled-information-format/.github/.github/workflows/reusable-attest-scan.yml@70389a7199d4d587b3d350e831334889bbcbd9de
    with:
      subject-name: ${{ needs.source.outputs.subject-name }}
      subject-digest: ${{ needs.source.outputs.subject-digest }}
      predicate-type: https://modeled-information-format.github.io/attestations/sca/v1
      predicate-artifact: ${{ needs.gate-sca.outputs.sarif-artifact }}
      predicate-filename: ${{ needs.gate-sca.outputs.sarif-filename }}

  attest-iac-license:
    name: Attest — IaC/license
    if: startsWith(github.ref, 'refs/tags/')
    needs: [meta, source, gate-trivy]
    permissions:
      id-token: write
      attestations: write
      contents: read
    # modeled-information-format/.github main @ 70389a7
    uses: >-
      modeled-information-format/.github/.github/workflows/reusable-attest-scan.yml@70389a7199d4d587b3d350e831334889bbcbd9de
    with:
      subject-name: ${{ needs.source.outputs.subject-name }}
      subject-digest: ${{ needs.source.outputs.subject-digest }}
      predicate-type: https://modeled-information-format.github.io/attestations/iac-license/v1
      predicate-artifact: ${{ needs.gate-trivy.outputs.sarif-artifact }}
      predicate-filename: ${{ needs.gate-trivy.outputs.sarif-filename }}

  vex:
    name: Gate — VEX (OpenVEX)
    if: startsWith(github.ref, 'refs/tags/')
    needs: [meta, source]
    permissions:
      id-token: write
      attestations: write
      contents: read
    # modeled-information-format/.github main @ 70389a7
    uses: >-
      modeled-information-format/.github/.github/workflows/reusable-vex.yml@70389a7199d4d587b3d350e831334889bbcbd9de
    with:
      subject-name: ${{ needs.source.outputs.subject-name }}
      subject-digest: ${{ needs.source.outputs.subject-digest }}
      vex-path: .vex/openvex.json

  verify:
    name: Verify Attestations (fail-closed)
    if: startsWith(github.ref, 'refs/tags/')
    needs: [meta, build, sbom, source, attest-sast, attest-sca, attest-iac-license, vex]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Download release artifacts
        # v8.0.1
        uses: >-
          actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: obsidian-plugin-${{ needs.meta.outputs.version }}-*
          path: dist
          merge-multiple: true
      - name: Fail-closed attestation verification
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          SEAM: modeled-information-format/.github/.github/workflows/reusable-attest-scan.yml
          VEX_SIGNER: modeled-information-format/.github/.github/workflows/reusable-vex.yml
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*)
          # main.js + manifest.json + styles.css + SBOM + source snapshot.
          if [ "${#files[@]}" -ne 5 ]; then
            echo "::error::expected 5 artifacts, found ${#files[@]}: ${files[*]}"
            exit 1
          fi
          for f in "${files[@]}"; do
            case "$f" in
              *-sbom.cdx.json) continue ;;
              *-source.tar.gz)
                gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
                  --predicate-type https://slsa.dev/provenance/v1
                for pt in sast sca iac-license; do
                  gh attestation verify "$f" --owner "$OWNER" \
                    --signer-workflow "$SEAM" \
                    --predicate-type "https://modeled-information-format.github.io/attestations/${pt}/v1"
                done
                gh attestation verify "$f" --owner "$OWNER" \
                  --signer-workflow "$VEX_SIGNER" \
                  --predicate-type https://openvex.dev/ns/v0.2.0 ;;
              *)
                gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
                  --predicate-type https://slsa.dev/provenance/v1
                gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
                  --predicate-type https://cyclonedx.org/bom ;;
            esac
          done
          echo "All attestations verified."

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [meta, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        # v8.0.1
        uses: >-
          actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: obsidian-plugin-${{ needs.meta.outputs.version }}-*
          path: dist
          merge-multiple: true
      - name: Checksums
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          cd dist
          sha256sum -- * > "obsidian-plugin-${VERSION}-checksums.txt"
          cat "obsidian-plugin-${VERSION}-checksums.txt"
      # Release assets keep Obsidian's required names (main.js, manifest.json,
      # styles.css); created with the GitHub CLI so no third-party action is needed.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          PRERELEASE=()
          case "${GITHUB_REF_NAME}" in *-*) PRERELEASE=(--prerelease) ;; esac
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${VERSION}" \
            --generate-notes \
            "${PRERELEASE[@]}"
